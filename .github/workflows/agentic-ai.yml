name: Agentic AI application tests
on:
  push:
    branches: [agentic-ai-applications]
  pull_request:
    branches: [agentic-ai-applications]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [querydesk, papertrail, patchpilot]
    defaults:
      run:
        working-directory: agentic-ai-projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
